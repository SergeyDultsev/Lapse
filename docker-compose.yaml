services:
  backend:
    build: ./backend
    container_name: nestjs
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - lapse_networks
    command: ["npm", "run", "start:dev"]

  frontend:
    build: ./frontend
    container_name: nextjs
    working_dir: /app
    restart: unless-stopped
    ports:
      - '5000:5000'
    volumes:
      - ./frontend:/app:cached
      - nextjs_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - PORT=5000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    deploy:
      resources:
        limits:
          memory: 6g
    networks:
      - lapse_networks

  db:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: lapse
      POSTGRES_PASSWORD: lapse
      POSTGRES_DB: lapse
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lapse -d lapse']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lapse_networks

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - '6379:6379'
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lapse_networks

volumes:
  db_data:
  redis_data:
  nextjs_node_modules:

networks:
  lapse_networks:
